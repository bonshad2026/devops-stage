# Consumes the build that the content-creator repo publishes.
#
# Two ways to start it:
#   - repository_dispatch (event_type: content-creator-release) from the app repo's
#     release workflow, as soon as a release is published
#   - workflow_dispatch, with the version typed in
#
# What it does: downloads the release assets, checks the checksum against the
# manifest, extracts the build, and proves it actually starts and answers
# /api/health. It does NOT deploy yet — content-creator has no staging slot
# until we decide whether it joins tibasoft or gets its own app.

name: content-creator

on:
  repository_dispatch:
    types: [content-creator-release]
  workflow_dispatch:
    inputs:
      version:
        description: Version to fetch, e.g. 0.1.4 (no leading v)
        required: true

permissions:
  contents: read

concurrency:
  group: content-creator
  cancel-in-progress: false

env:
  APP: content-creator
  SOURCE_REPO: bonshad2026/content-creator

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: v
        run: |
          set -euo pipefail
          V="${{ inputs.version || github.event.client_payload.version }}"
          [ -n "$V" ] || { echo "::error::no version supplied"; exit 1; }
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Fetching $APP $V from $SOURCE_REPO"

      - name: Download the release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download "v${{ steps.v.outputs.version }}" \
            --repo "$SOURCE_REPO" --dir art --pattern "content-creator-*"

      - name: Verify the checksum file
        run: |
          cd art && sha256sum -c ./*.tar.gz.sha256

      - name: Verify the manifest agrees
        run: |
          set -euo pipefail
          MANIFEST=$(ls art/*.manifest.json)
          WANT=$(jq -r .sha256 "$MANIFEST")
          GOT=$(sha256sum art/*.tar.gz | cut -d' ' -f1)
          [ "$WANT" = "$GOT" ] || { echo "::error::manifest sha256 $WANT != file $GOT"; exit 1; }
          jq -e --arg app "$APP" '.app == $app' "$MANIFEST" > /dev/null \
            || { echo "::error::$MANIFEST is not a $APP build"; exit 1; }
          jq '{app, version, commit, builtAt, size}' "$MANIFEST"

      - name: Extract the build
        run: |
          mkdir -p build
          tar -xzf art/*.tar.gz -C build
          echo "bytes: $(du -sb build | cut -f1)"

      - name: Check the runtime is really in there
        run: |
          set -euo pipefail
          for f in server.js package.json public/index.html node_modules/express; do
            [ -e "build/$f" ] || { echo "::error::build is missing $f"; exit 1; }
          done
          echo "runtime layout looks sane"

      - name: Start it and hit /api/health
        run: |
          set -euo pipefail
          PORT=8099 DATA_DIR=/tmp/cc-data node build/server.js > /tmp/server.log 2>&1 &
          SERVER=$!
          trap 'kill $SERVER 2>/dev/null || true' EXIT

          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8099/api/health > /dev/null && break
            sleep 1
          done

          curl -fsS http://127.0.0.1:8099/api/health
          echo
          curl -fsS http://127.0.0.1:8099/ | head -c 120
          echo
          echo "--- server log ---"
          cat /tmp/server.log
