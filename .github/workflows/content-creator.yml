name: content-creator

on:
  repository_dispatch:
    types: [content-creator-release]
  workflow_dispatch:
    inputs:
      version:
        description: Version to deploy, e.g. 0.1.4
        required: true

env:
  SOURCE_REPO: bonshad2026/content-creator
  LIARA_APP: bstage

jobs:
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Download and extract the build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V="${{ inputs.version || github.event.client_payload.version }}"
          gh release download "v$V" --repo "$SOURCE_REPO" --dir art --pattern "content-creator-*"
          mkdir -p deploy
          tar -xzf art/*.tar.gz -C deploy
          cp Dockerfile liara.json deploy/
          du -sh deploy

      - name: Deploy to Liara
        env:
          LIARA_API_TOKEN: ${{ secrets.LIARA_API_TOKEN }}
        run: |
          npm i -g @liara/cli@9
          liara deploy --app "$LIARA_APP" --path deploy --platform docker \
            --port 8080 --no-app-logs --api-token "$LIARA_API_TOKEN"
