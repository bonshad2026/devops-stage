# Builds and deploys the single bstage image, which hosts every app in apps/.
#
# One deploy rebuilds the whole image from the versions pinned in
# deploy.lock.json, so it restarts every app. That is accepted for staging.
#
# Triggered by an app's release workflow (repository_dispatch, event
# `app-release`, payload {app, version}) or manually with app + version.
#
# Adding an app: apps/<name>/app.json with source_repo, artifact, route, port,
# data_dir, disk, entry, health — plus its disk in liara.json.

name: deploy

on:
  repository_dispatch:
    types: [app-release]
  workflow_dispatch:
    inputs:
      app:
        description: App folder under apps/, e.g. content-creator
        required: true
      version:
        description: Release version to deploy, e.g. 0.1.5
        required: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Pin the version
        run: |
          set -euo pipefail
          APP="${{ inputs.app || github.event.client_payload.app }}"
          VER="${{ inputs.version || github.event.client_payload.version }}"
          [ -d "apps/$APP" ] || { echo "::error::apps/$APP does not exist"; exit 1; }
          jq --arg app "$APP" --arg ver "$VER" '.[$app] = $ver' deploy.lock.json > lock.tmp
          mv lock.tmp deploy.lock.json
          echo "--- deploy.lock.json ---"
          cat deploy.lock.json

      - name: Stage every app at its pinned version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p stage/apps
          jq -r 'to_entries[] | "\(.key) \(.value)"' deploy.lock.json |
          while read -r app ver; do
            cfg="apps/$app/app.json"
            repo=$(jq -r .source_repo "$cfg")
            pattern=$(jq -r .artifact "$cfg")
            echo "staging $app $ver from $repo"
            mkdir -p "stage/apps/$app/app"
            gh release download "v$ver" --repo "$repo" --dir "/tmp/art-$app" --pattern "$pattern"
            tar -xzf "/tmp/art-$app/"*.tar.gz -C "stage/apps/$app/app"
            cp "$cfg" "stage/apps/$app/app.json"
          done
          cp launcher.mjs liara.json stage/
          du -sh stage

      - name: Deploy to Liara
        env:
          LIARA_API_TOKEN: ${{ secrets.LIARA_API_TOKEN }}
        run: |
          set -euo pipefail
          npm i -g @liara/cli@9
          liara deploy --app bstage --path stage --platform docker \
            --port 8080 --no-app-logs --api-token "$LIARA_API_TOKEN"

      - name: Record what went out
        run: |
          echo "deployed bstage with:"
          cat deploy.lock.json
