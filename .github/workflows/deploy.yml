# Static bstage deployment. Child application deployment is temporarily disabled.
name: deploy

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bstage-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Stage static site
        run: |
          mkdir -p stage
          cp Dockerfile index.html liara.json stage/

      - name: Deploy static site to Liara
        env:
          LIARA_API_TOKEN: ${{ secrets.LIARA_API_TOKEN }}
        run: |
          npm i -g @liara/cli@9
          liara deploy --app bstage --path stage --platform docker \
            --port 80 --no-app-logs --api-token "$LIARA_API_TOKEN"
